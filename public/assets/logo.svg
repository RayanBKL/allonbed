<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </radialGradient>
    <radialGradient id="chipBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14171E"/>
      <stop offset="85%" stop-color="#08090C"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Casino Chip Edge -->
  <circle cx="250" cy="250" r="235" fill="url(#chipBg)" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Outer Dotted / Tab Rim -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="14 12" opacity="0.8"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Card Suits Around Rim -->
  <!-- Spades, Hearts, Diamonds, Clubs -->
  <g fill="#D4AF37" opacity="0.85" transform="scale(0.8) translate(62, 62)">
    <!-- Top -->
    <path d="M250 85 C240 70 215 90 235 110 L250 125 L265 110 C285 90 260 70 250 85 Z M247 122 L245 130 L255 130 L253 122 Z"/>
    <!-- Right -->
    <path d="M415 250 L395 240 L375 250 L395 260 Z"/>
    <!-- Bottom -->
    <path d="M250 415 C240 400 215 420 235 440 L250 455 L265 440 C285 420 260 400 250 415 Z M247 452 L245 460 L255 460 L253 452 Z"/>
    <!-- Left -->
    <path d="M85 250 L105 240 L125 250 L105 260 Z"/>
  </g>

  <!-- Inner Circle Border -->
  <circle cx="250" cy="250" r="170" fill="#0D0F14" stroke="#D4AF37" stroke-width="3"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Cards & Dice Graphic -->
  <g transform="translate(250, 160) scale(0.95)">
    <!-- Card Ace of Diamonds -->
    <g transform="translate(-45, -45) rotate(-10)">
      <rect x="-24" y="-36" width="48" height="72" rx="4" fill="#181B22" stroke="#D4AF37" stroke-width="2"/>
      <text x="-16" y="-18" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#D4AF37">A</text>
      <polygon points="0,-8 6,0 0,8 -6,0" fill="#D4AF37"/>
    </g>
    
    <!-- Card Jack of Hearts -->
    <g transform="translate(0, -48) rotate(6)">
      <rect x="-24" y="-36" width="48" height="72" rx="4" fill="#181B22" stroke="#D4AF37" stroke-width="2"/>
      <text x="-16" y="-18" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#D4AF37">J</text>
      <!-- Heart -->
      <path d="M0 -4 C-3 -10 -9 -6 -5 0 L0 5 L5 0 C9 -6 3 -10 0 -4 Z" fill="#D4AF37"/>
      <!-- Knight/Jack Profile outline -->
      <circle cx="2" cy="14" r="8" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    </g>

    <!-- Isometric 3D Die -->
    <g transform="translate(50, -32) scale(0.9)">
      <!-- Top Face -->
      <polygon points="0,-18 20,-8 0,2 -20,-8" fill="#252A36" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="0" cy="-8" r="2.5" fill="#FFF4D0"/>
      <!-- Right Face -->
      <polygon points="20,-8 20,16 0,26 0,2" fill="#1B1E27" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="10" cy="5" r="2" fill="#FFF4D0"/>
      <circle cx="10" cy="18" r="2" fill="#FFF4D0"/>
      <!-- Left Face -->
      <polygon points="-20,-8 -20,16 0,26 0,2" fill="#13161D" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="-12" cy="2" r="2" fill="#FFF4D0"/>
      <circle cx="-12" cy="12" r="2" fill="#FFF4D0"/>
      <circle cx="-12" cy="22" r="2" fill="#FFF4D0"/>
      <circle cx="-4" cy="7" r="2" fill="#FFF4D0"/>
      <circle cx="-4" cy="17" r="2" fill="#FFF4D0"/>
    </g>
  </g>

  <!-- Typography ALL ON BED -->
  <!-- "ALL ON" -->
  <text x="250" y="248" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Cinzel', serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="6" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)">
    ALL ON
  </text>

  <!-- "BED" Marquee Vegas Style -->
  <g transform="translate(250, 310)">
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="62" 
          letter-spacing="10" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="3">
      BED
    </text>
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="62" 
          letter-spacing="10" 
          fill="#12151B">
      BED
    </text>
    
    <!-- Bulb Dots on BED -->
    <!-- B -->
    <circle cx="-62" cy="-36" r="2" fill="#FFF4D0"/>
    <circle cx="-62" cy="-20" r="2" fill="#FFF4D0"/>
    <circle cx="-62" cy="-4" r="2" fill="#FFF4D0"/>
    <circle cx="-45" cy="-28" r="2" fill="#FFF4D0"/>
    <circle cx="-45" cy="-12" r="2" fill="#FFF4D0"/>
    <!-- E -->
    <circle cx="-10" cy="-36" r="2" fill="#FFF4D0"/>
    <circle cx="-10" cy="-20" r="2" fill="#FFF4D0"/>
    <circle cx="-10" cy="-4" r="2" fill="#FFF4D0"/>
    <circle cx="8" cy="-36" r="2" fill="#FFF4D0"/>
    <circle cx="4" cy="-20" r="2" fill="#FFF4D0"/>
    <circle cx="8" cy="-4" r="2" fill="#FFF4D0"/>
    <!-- D -->
    <circle cx="44" cy="-36" r="2" fill="#FFF4D0"/>
    <circle cx="44" cy="-20" r="2" fill="#FFF4D0"/>
    <circle cx="44" cy="-4" r="2" fill="#FFF4D0"/>
    <circle cx="62" cy="-20" r="2" fill="#FFF4D0"/>
  </g>

  <!-- Bottom Suits Strip -->
  <g transform="translate(250, 355)" fill="#D4AF37" opacity="0.9">
    <!-- Heart -->
    <path d="M-40 -4 C-43 -10 -49 -6 -45 0 L-40 5 L-35 0 C-31 -6 -37 -10 -40 -4 Z"/>
    <!-- Spade -->
    <path d="M-13 -6 C-21 -1 -17 6 -13 9 L-13 12 L-11 12 L-11 9 C-7 6 -3 -1 -11 -6 Z"/>
    <!-- Diamond -->
    <polygon points="15,-6 21,1 15,8 9,1"/>
    <!-- Club -->
    <circle cx="40" cy="-3" r="3.5"/>
    <circle cx="36" cy="3" r="3.5"/>
    <circle cx="44" cy="3" r="3.5"/>
    <polygon points="39,2 41,2 42,9 38,9"/>
  </g>
</svg>
